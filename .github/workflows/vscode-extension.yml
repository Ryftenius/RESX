name: VS Code Extension

on:
  push:
    branches:
      - main
      - master
    paths:
      - "resx-vscode/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "resx-vscode/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: resx-vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: resx-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: resx-vscode-vsix
          path: resx-vscode/*.vsix
