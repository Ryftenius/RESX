name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version metadata
        id: version
        shell: powershell
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch 'version\s*=\s*"([^"]+)"') {
            throw 'Unable to read version from Cargo.toml'
          }
          $version = $matches[1]
          $runNumber = if ("${{ github.event_name }}" -eq "workflow_run") { "${{ github.event.workflow_run.run_number }}" } else { "${{ github.run_number }}" }
          $runAttempt = if ("${{ github.event_name }}" -eq "workflow_run") { "${{ github.event.workflow_run.run_attempt }}" } else { "${{ github.run_attempt }}" }
          $shortSha = "${{ github.event.workflow_run.head_sha || github.sha }}".Substring(0, 7)
          $tag = "v$version-ci.$runNumber.$runAttempt"
          $releaseName = "resx v$version CI build $runNumber.$runAttempt"
          $artifactSuffix = "ci.$runNumber.$runAttempt"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_number=$runNumber" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_attempt=$runAttempt" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short_sha=$shortSha" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_name=$releaseName" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_suffix=$artifactSuffix" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create version tag
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" "${{ github.event.workflow_run.head_sha || github.sha }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Build release
        run: cargo build --release

      - name: Package artifacts
        shell: powershell
        run: |
          $artifactRoot = "dist"
          $artifactName = "resx-${{ steps.version.outputs.version }}-windows-x86_64-${{ steps.version.outputs.artifact_suffix }}"
          $artifactDir = Join-Path $artifactRoot $artifactName
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item target\release\resx.exe $artifactDir\
          Copy-Item README.md $artifactDir\
          Copy-Item COMMANDS.md $artifactDir\
          Compress-Archive -Path "$artifactDir\*" -DestinationPath "$artifactRoot\$artifactName.zip" -Force
          Get-FileHash "$artifactRoot\$artifactName.zip" -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $artifactName.zip" | Out-File "$artifactRoot\$artifactName.zip.sha256" -Encoding ascii
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resx-release-${{ steps.version.outputs.version }}-${{ steps.version.outputs.artifact_suffix }}
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          append_body: true
          prerelease: true
          body: |
            CI release metadata:
            - Cargo version: `${{ steps.version.outputs.version }}`
            - CI run: `${{ steps.version.outputs.run_number }}.${{ steps.version.outputs.run_attempt }}`
            - Commit: `${{ steps.version.outputs.short_sha }}`
