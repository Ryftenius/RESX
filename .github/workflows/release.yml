name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Read version metadata
        id: version
        shell: powershell
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch 'version\s*=\s*"([^"]+)"') {
            throw 'Unable to read version from Cargo.toml'
          }
          $version = $matches[1]
          $tag = "v$version"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Update version tag to released commit
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.version.outputs.tag }}" "${{ github.sha }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}" --force

      - name: Build release
        run: cargo build --release

      - name: Package artifacts
        shell: powershell
        run: |
          $artifactRoot = "dist"
          $artifactName = "resx-${{ steps.version.outputs.version }}-windows-x86_64"
          $artifactDir = Join-Path $artifactRoot $artifactName
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item target\release\resx.exe $artifactDir\
          Copy-Item README.md $artifactDir\
          Copy-Item COMMANDS.md $artifactDir\
          Compress-Archive -Path "$artifactDir\*" -DestinationPath "$artifactRoot\$artifactName.zip" -Force
          Get-FileHash "$artifactRoot\$artifactName.zip" -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $artifactName.zip" | Out-File "$artifactRoot\$artifactName.zip.sha256" -Encoding ascii
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resx-release-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
