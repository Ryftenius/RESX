name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-and-test:
    runs-on: windows-latest
    env:
      # Do not inherit target-cpu=native from .cargo/config.toml in CI.
      # Hosted runner CPU models can differ between cache creation and reuse,
      # which can make cached build scripts crash with ILLEGAL_INSTRUCTION.
      RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=+crt-static -C link-args=/SUBSYSTEM:CONSOLE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Release build smoke check
        run: cargo build --release
