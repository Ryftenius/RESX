[package]
name = "resx"
version = "1.0.1"
edition = "2021"
authors = ["TITAN Softwork Solutions"]
description = "Windows binary recon CLI for exports, PDB-backed symbols, CFG recovery, and triage"

[dependencies]
iced-x86 = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
clap         = { version = "4", features = ["derive"] }
rayon        = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
